name: CI - Tests Automatizados

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Ejecutar Tests Automatizados (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v6

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar suite de tests
        run: npm run test
        env:
          NODE_ENV: test

  deploy:
      name: Desplegar en Render
      needs: test
      # Solo despliega si los tests pasan AND el alumno ha configurado su secreto RENDER_DEPLOY_HOOK_URL
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RENDER_DEPLOY_HOOK_URL != ''
      runs-on: ubuntu-latest

      steps:
      - name: Disparar Deploy Hook en Render
          run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
